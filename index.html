<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Koi Pond</title>
<meta name="description" content="An interactive ASCII koi pond: drop pebbles, stir the water and watch the koi scatter.">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #e6e6e6;
    --dim: #8a8a8a;
    --line: #3a3a3a;
    --font: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .ui { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  h1 { margin: 0 12px 0 0; font-size: 14px; letter-spacing: .05em; }
  button { font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button:disabled { color: var(--line); border-color: #1e1e1e; cursor: default; }
  .hint { position: fixed; left: 16px; right: 16px; bottom: 16px; margin: 0; font-size: 12px; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="pond" role="img" aria-label="ASCII koi pond. Click or tap to drop a pebble, drag to stir the water."></canvas>
<div class="ui">
  <h1>ascii koi pond</h1>
  <button id="pause" type="button">Pause</button>
  <button id="rain" type="button">Rain: on</button>
  <button id="add" type="button">Add koi</button>
  <button id="calm" type="button">Calm water</button>
  <button id="restart" type="button">Restart</button>
</div>
<p class="hint" id="hint">click to drop a pebble · drag to stir · the koi scare easily</p>

<script>
"use strict";
const canvas = document.getElementById("pond");
const ctx = canvas.getContext("2d");
const $ = (id) => document.getElementById(id);

const LINE = 16;                     // text row height in px
const FONT = '14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
const RAMP = " .:-~=+*#%@";          // ripple strength, faint to strong
const TONES = ["#2c2c2c", "#6a6a6a", "#b4b4b4", "#ffffff"];
const DAMPING = 0.986;
const FULL = 48;                     // ripple height drawn with the densest character
const STEP_MS = 1000 / 60;           // fixed 60 Hz simulation, whatever the screen's refresh rate
const START_KOI = 5, MAX_KOI = 12;
const SEG = 11, GAP = 7;             // koi spine: points and spacing in px
const WIDTH = [3, 6, 8, 9, 8, 7, 5, 4, 3, 2, 0]; // body half-width per spine point
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W, H, cw, cols, rows, simCols, simRows, cur, prev;
let cellCh = [], cellTone = new Uint8Array(0), rowMask = new Uint8Array(0);
let koi = [], scares = [];
let paused = reduceMotion, raining = !reduceMotion;
let time = 0, acc = 0, last = 0, rafId = 0;
let dragging = false, lastDrag = null;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = FONT; ctx.textBaseline = "top";
  cw = ctx.measureText("M").width;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / LINE);
  // Two simulation rows per text row keep simulation cells about square, so ripples spread as circles.
  simCols = cols; simRows = rows * 2;
  // shortcut: a resize clears the ripples; keep the old field if mobile address-bar resizes bother anyone.
  cur = new Float32Array(simCols * simRows); prev = new Float32Array(simCols * simRows);
}

// One step of the 2D wave equation. a = current heights, b = previous; b is overwritten with the next heights.
function step(a, b, w, h, damping) {
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1, i = y * w + 1; x < w - 1; x++, i++) {
      b[i] = ((a[i - 1] + a[i + 1] + a[i - w] + a[i + w]) * 0.5 - b[i]) * damping;
    }
  }
}

function drop(px, py, strength, radius) {
  const cx = px / cw, cy = py / (LINE / 2);
  for (let y = Math.max(1, Math.floor(cy - radius)); y <= Math.min(simRows - 2, Math.ceil(cy + radius)); y++) {
    for (let x = Math.max(1, Math.floor(cx - radius)); x <= Math.min(simCols - 2, Math.ceil(cx + radius)); x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d < radius) cur[y * simCols + x] -= strength * (1 - d / radius);
    }
  }
}

function scare(x, y, r, life) { scares.push({ x, y, r, life, max: life }); }

function makeKoi() {
  const m = Math.min(80, W / 3, H / 3);
  const x = rand(m, W - m), y = rand(m, H - m), a = rand(0, Math.PI * 2);
  return {
    spine: Array.from({ length: SEG }, (_, i) => ({ x: x - Math.cos(a) * i * GAP, y: y - Math.sin(a) * i * GAP })),
    a, turn: 0, speed: rand(0.6, 1), boost: 0, phase: rand(0, 6.28),
    light: Math.random() < 0.7,                       // white koi with gray patches, or the reverse
    patches: Array.from({ length: SEG }, () => Math.random() < 0.35),
  };
}

function steerTo(f, target, rate) {
  const d = Math.atan2(Math.sin(target - f.a), Math.cos(target - f.a));
  f.a += clamp(d, -rate, rate);
}

function updateKoi(f) {
  const head = f.spine[0];
  f.turn = clamp(f.turn + (Math.random() - 0.5) * 0.01, -0.025, 0.025);   // slow wander
  f.a += f.turn;
  const m = 70;
  if (head.x < m || head.x > W - m || head.y < m || head.y > H - m) {
    steerTo(f, Math.atan2(H / 2 - head.y, W / 2 - head.x), 0.06);
  }
  for (const s of scares) {
    const dx = head.x - s.x, dy = head.y - s.y, d = Math.hypot(dx, dy);
    if (d < s.r) {
      steerTo(f, Math.atan2(dy, dx), 0.2);
      f.boost = Math.max(f.boost, 3.2 * (1 - d / s.r) * (s.life / s.max));
    }
  }
  f.boost *= 0.96;
  const v = f.speed + f.boost;
  f.phase += 0.1 + v * 0.06;
  const heading = f.a + Math.sin(f.phase) * 0.3;                          // swimming wiggle
  head.x = clamp(head.x + Math.cos(heading) * v, 2, W - 2);
  head.y = clamp(head.y + Math.sin(heading) * v, 2, H - 2);
  for (let i = 1; i < SEG; i++) {                                          // body follows the head
    const p = f.spine[i], q = f.spine[i - 1];
    const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy) || 1;
    p.x = q.x + dx / d * GAP; p.y = q.y + dy / d * GAP;
  }
  if (Math.random() < 0.08 + f.boost * 0.1) drop(head.x, head.y, 8 + f.boost * 6, 1.5); // faint wake
}

function update() {
  time++;
  if (raining && Math.random() < 0.012) drop(rand(0, W), rand(0, H), rand(40, 90), 2);
  for (const f of koi) updateKoi(f);
  for (const s of scares) s.life--;
  scares = scares.filter((s) => s.life > 0);
  step(cur, prev, simCols, simRows, DAMPING);
  [cur, prev] = [prev, cur];
}

function put(x, y, ch, tone) {
  const c = Math.floor(x / cw), r = Math.floor(y / LINE);
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r * cols + c;
  cellCh[i] = ch; cellTone[i] = tone; rowMask[r] |= 1 << tone;
}

function drawKoi(f) {
  const sp = f.spine, body = f.light ? 3 : 2, patch = f.light ? 2 : 3;
  for (let i = SEG - 1; i >= 0; i--) {                                     // tail first, so the head wins overlaps
    const p = sp[i], q = sp[Math.max(0, i - 1)], o = sp[Math.min(SEG - 1, i + 1)];
    const dx = q.x - o.x, dy = q.y - o.y, d = Math.hypot(dx, dy) || 1;
    const nx = -dy / d, ny = dx / d;                                       // unit normal to the body
    if (i === 2) {
      const fin = WIDTH[i] + 6 + Math.sin(f.phase * 0.5) * 3;
      put(p.x + nx * fin, p.y + ny * fin, "~", 2); put(p.x - nx * fin, p.y - ny * fin, "~", 2);
    }
    if (i === SEG - 1) { put(p.x + nx * 6, p.y + ny * 6, "~", 2); put(p.x - nx * 6, p.y - ny * 6, "~", 2); }
    const ch = i === 0 ? "@" : i === SEG - 1 ? "~" : i === SEG - 2 ? "+" : i === SEG - 3 ? "*" : f.patches[i] ? "%" : "#";
    const tone = i > 0 && i < SEG - 3 && f.patches[i] ? patch : body;
    const w = WIDTH[i];
    if (w) { put(p.x + nx * w, p.y + ny * w, ch, tone); put(p.x - nx * w, p.y - ny * w, ch, tone); }
    put(p.x, p.y, ch, tone);
  }
}

function render() {
  const n = cols * rows;
  if (cellTone.length !== n) { cellCh = new Array(n); cellTone = new Uint8Array(n); rowMask = new Uint8Array(rows); }
  rowMask.fill(0);
  for (let r = 0, i = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++, i++) {
      const s = r * 2 * simCols + c;
      const h = (cur[s] + cur[s + simCols]) * 0.5;
      const level = Math.abs(h) / FULL;
      let ch = " ", tone = 0;
      if (level > 0.1) {
        ch = RAMP[1 + Math.min(RAMP.length - 2, Math.floor(level * (RAMP.length - 2)))];
        tone = level < 0.2 ? 0 : h > 0 && level >= 0.4 ? 2 : 1;            // faint tails dark, crests bright
      } else {                                                             // calm water: slow drifting glints
        const u = c * 0.09, v = r * 0.2, t = time * 0.004;                 // warped sines: wavy caustic lines, no grid
        const amb = Math.sin(u + Math.sin(v * 1.3 + t) * 1.8 + t) * Math.sin(v - Math.sin(u * 0.8 - t * 1.3) * 1.5);
        if (amb > 0.97) ch = "~"; else if (amb > 0.9) ch = ".";
      }
      cellCh[i] = ch; cellTone[i] = tone;
      if (ch !== " ") rowMask[r] |= 1 << tone;
    }
  }
  for (const f of koi) drawKoi(f);

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  for (let t = 0; t < TONES.length; t++) {                                 // one fillText per row and tone
    ctx.fillStyle = TONES[t];
    for (let r = 0; r < rows; r++) {
      if (!(rowMask[r] & (1 << t))) continue;
      let s = "";
      for (let c = 0, i = r * cols; c < cols; c++, i++) s += cellTone[i] === t ? cellCh[i] : " ";
      ctx.fillText(s, 0, r * LINE + 1);
    }
  }
}

function frame(now) {
  rafId = 0;
  if (paused) return;
  acc = Math.min(acc + (last ? now - last : STEP_MS), 100);
  last = now;
  while (acc >= STEP_MS) { update(); acc -= STEP_MS; }
  render();
  rafId = requestAnimationFrame(frame);
}

function start() { if (!rafId) { last = 0; rafId = requestAnimationFrame(frame); } }
function redrawIfPaused() { if (paused) render(); }

function restart() {
  cur.fill(0); prev.fill(0);
  scares = []; time = 0;
  koi = Array.from({ length: START_KOI }, makeKoi);
  $("add").disabled = false;
  drop(W / 2, H / 2, 120, 3);
  render();
}

canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
  drop(e.clientX, e.clientY, 140, 3);
  scare(e.clientX, e.clientY, 180, 90);
  lastDrag = { x: e.clientX, y: e.clientY };
  redrawIfPaused();
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging || Math.hypot(e.clientX - lastDrag.x, e.clientY - lastDrag.y) < 10) return;
  drop(e.clientX, e.clientY, 35, 2);
  scare(e.clientX, e.clientY, 110, 30);
  lastDrag = { x: e.clientX, y: e.clientY };
  redrawIfPaused();
});
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("pointercancel", () => { dragging = false; });

$("pause").addEventListener("click", (e) => {
  paused = !paused;
  e.currentTarget.textContent = paused ? "Resume" : "Pause";
  if (!paused) start();
});
$("rain").addEventListener("click", (e) => {
  raining = !raining;
  e.currentTarget.textContent = raining ? "Rain: on" : "Rain: off";
});
$("add").addEventListener("click", (e) => {
  if (koi.length < MAX_KOI) koi.push(makeKoi());
  e.currentTarget.disabled = koi.length >= MAX_KOI;
  redrawIfPaused();
});
$("calm").addEventListener("click", () => { cur.fill(0); prev.fill(0); scares = []; redrawIfPaused(); });
$("restart").addEventListener("click", restart);
addEventListener("resize", () => {
  resize();
  for (const f of koi) for (const p of f.spine) { p.x = clamp(p.x, 2, W - 2); p.y = clamp(p.y, 2, H - 2); }
  render();
});

if (reduceMotion) {
  $("pause").textContent = "Resume";
  $("rain").textContent = "Rain: off";
  $("hint").textContent += " · paused because reduced motion is on";
}
resize();
restart();
start();

// Open with ?selfcheck to test the ripple maths in the console.
if (new URLSearchParams(location.search).has("selfcheck")) {
  const w = 41, h = 41, sum = (arr) => arr.reduce((s, v) => s + Math.abs(v), 0);
  let a = new Float32Array(w * h), b = new Float32Array(w * h), early = 0;
  a[20 * w + 20] = -100;
  for (let i = 0; i < 300; i++) { step(a, b, w, h, DAMPING); [a, b] = [b, a]; if (i === 10) early = sum(a); }
  const ok = a.every(Number.isFinite) && sum(a) < early && Math.abs(a[20 * w + 30] - a[30 * w + 20]) < 1e-3;
  console.assert(ok, "selfcheck failed");
  console.log("selfcheck " + (ok ? "passed" : "FAILED") + ": finite, decaying and spreading evenly in x and y");
}
</script>
</body>
</html>
